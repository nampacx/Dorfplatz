name: Deploy (infra + API + frontend)

# One orchestrated pipeline. The infra job provisions with Bicep and exposes the
# resource names as job outputs; the API and frontend jobs consume them, so nothing
# has to be wired by hand. The SWA deploy token and DB migrations are handled
# automatically (migrations run on API start-up via DbInitializer).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        default: dev
        type: choice
        options: [ dev, prod ]
  push:
    branches: [ main ]
    paths: [ 'infra/**', 'api/**', 'frontend/**', '.github/workflows/deploy.yml' ]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}

jobs:
  # --------------------------------------------------------------------------
  infra:
    name: Provision infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    outputs:
      functionAppName: ${{ steps.deploy.outputs.functionAppName }}
      staticWebAppName: ${{ steps.deploy.outputs.staticWebAppName }}
      staticWebAppHostname: ${{ steps.deploy.outputs.staticWebAppHostname }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        id: deploy
        uses: azure/cli@v3
        with:
          inlineScript: |
            set -euo pipefail
            outputs=$(az deployment group create \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "bb-${{ env.ENVIRONMENT }}-${{ github.run_number }}" \
              --template-file infra/main.bicep \
              --parameters \
                environmentName='${{ env.ENVIRONMENT }}' \
                postgresAdminPassword='${{ secrets.POSTGRES_ADMIN_PASSWORD }}' \
                deployerObjectId='${{ secrets.DEPLOYER_OBJECT_ID }}' \
                entraClientId='${{ secrets.ENTRA_CLIENT_ID }}' \
                entraClientSecret='${{ secrets.ENTRA_CLIENT_SECRET }}' \
                googleClientId='${{ secrets.GOOGLE_CLIENT_ID }}' \
                googleClientSecret='${{ secrets.GOOGLE_CLIENT_SECRET }}' \
                seedAdminEmail='${{ secrets.SEED_ADMIN_EMAIL }}' \
              --query properties.outputs -o json)
            echo "functionAppName=$(echo "$outputs" | jq -r .functionAppName.value)" >> "$GITHUB_OUTPUT"
            echo "staticWebAppName=$(echo "$outputs" | jq -r .staticWebAppName.value)" >> "$GITHUB_OUTPUT"
            echo "staticWebAppHostname=$(echo "$outputs" | jq -r .staticWebAppHostname.value)" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  api:
    name: Deploy API
    needs: infra
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish api/BulletinBoard.Api.csproj -c Release -o ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.infra.outputs.functionAppName }}
          package: ./publish
      # DB migrations are applied automatically on cold start (DbInitializer.MigrateAsync).

  # --------------------------------------------------------------------------
  frontend:
    name: Deploy frontend
    needs: infra
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch SWA deployment token
        id: token
        uses: azure/cli@v3
        with:
          inlineScript: |
            set -euo pipefail
            token=$(az staticwebapp secrets list \
              --name "${{ needs.infra.outputs.staticWebAppName }}" \
              --query "properties.apiKey" -o tsv)
            echo "::add-mask::$token"
            echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Build & deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 'frontend'
          output_location: 'dist'
          # No api_location: the API is a separate "bring your own" Function App,
          # deployed by the job above. (skip_api_build is not a valid input and
          # was logged as an unexpected one.)
        env:
          VITE_API_BASE: '/api'
