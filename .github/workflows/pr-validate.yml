name: PR Validation

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 20 reached end of life in April 2026; 24 is the active LTS and
          # matches the runtime the actions themselves now run on.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build
      - run: npm test --if-present

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore api/BulletinBoard.Api.csproj
      - run: dotnet build api/BulletinBoard.Api.csproj -c Release --no-restore
      # --if-present is an npm flag, not a dotnet one: the old command always
      # errored and was swallowed by "|| true". Run tests only if any exist,
      # and let a real failure fail the build.
      - name: Test
        run: |
          if find . -name '*Tests*.csproj' -o -name '*.Tests.csproj' | grep -q .; then
            dotnet test -c Release
          else
            echo "No test projects found; skipping."
          fi

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Bicep
        run: |
          az bicep build --file infra/main.bicep
