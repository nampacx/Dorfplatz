name: Deploy infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        default: dev
        type: choice
        options: [ dev, prod ]
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infra.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-infra-${{ github.ref }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}

jobs:
  infra:
    name: Provision infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        uses: azure/cli@v3
        with:
          inlineScript: |
            set -euo pipefail
            az deployment group create \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "bb-${{ env.ENVIRONMENT }}-${{ github.run_number }}" \
              --template-file infra/main.bicep \
              --parameters \
                environmentName='${{ env.ENVIRONMENT }}' \
                postgresAdminPassword='${{ secrets.POSTGRES_ADMIN_PASSWORD }}' \
                deployerObjectId='${{ secrets.DEPLOYER_OBJECT_ID }}' \
                entraClientId='${{ secrets.ENTRA_CLIENT_ID }}' \
                entraClientSecret='${{ secrets.ENTRA_CLIENT_SECRET }}' \
                googleClientId='${{ secrets.GOOGLE_CLIENT_ID }}' \
                googleClientSecret='${{ secrets.GOOGLE_CLIENT_SECRET }}' \
                seedAdminEmail='${{ secrets.SEED_ADMIN_EMAIL }}'
