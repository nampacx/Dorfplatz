<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Schwarzes Brett — probe</title>
    <script>
      (function () {
        const json = (d) => new Response(JSON.stringify(d), { status: 200, headers: { 'content-type': 'application/json' } })
        const me = { id: 'u1', email: 'test@example.com', displayName: 'Testnutzer', roles: ['user','moderator','admin'], hasConsented: false }
        const convos = [
          { id: 'c1', listingType: 'goods', listingId: 'g1', otherUserId: 'u2', otherUserName: 'Bernd Schmidt', lastMessageAt: '2026-08-11T18:00:00Z', unreadCount: 2 },
          { id: 'c2', listingType: null, listingId: null, otherUserId: 'u3', otherUserName: 'Claudia Weber', lastMessageAt: '2026-08-10T09:30:00Z', unreadCount: 0 }
        ]
        const msgs = Array.from({ length: 24 }, (_, i) => ({
          id: 'm' + i, conversationId: 'c1', senderId: i % 2 ? 'u1' : 'u2',
          senderName: i % 2 ? 'Testnutzer' : 'Bernd Schmidt',
          body: 'Nachricht Nummer ' + i + ', gelegentlich etwas laenger damit Zeilen umbrechen.',
          sentAt: '2026-08-11T1' + (i % 9) + ':00:00Z', isMine: i % 2 === 1
        }))
        const svg = (n) => 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="#1546a0"/><text x="400" y="360" font-size="220" fill="#ffc21a" text-anchor="middle">' + n + '</text></svg>')
        const goods = [{
          id: 'g1', title: 'Fahrrad, 28 Zoll', description: 'Gut erhalten, wenig gefahren. '.repeat(8),
          price: 120, currency: 'EUR', condition: 'Used', category: 'Sport', location: 'Dorfmitte',
          status: 'Active', authorName: 'Bernd Schmidt', authorId: 'u2',
          images: [1, 2, 3, 4].map((n) => ({ id: 'i' + n, url: svg(n) })),
          createdAt: '2026-08-01T10:00:00Z', canEdit: false
        }]
        const services = [{ id: 's1', type: 'Offering', title: 'Rasen maehen', description: 'Ich helfe gern. '.repeat(6), category: 'Garten', status: 'Active', authorName: 'Claudia Weber', authorId: 'u3', createdAt: '2026-08-02T10:00:00Z', canEdit: false }]
        const events = [{ id: 'e1', title: 'Sommerfest am Dorfplatz', description: 'Musik, Kuchen und Tombola. '.repeat(10), eventDate: '2026-08-20T16:00:00Z', location: 'Dorfplatz', category: 'Vereine', status: 'Published', rejectionReason: null, authorName: 'Anna Muster', createdAt: '2026-08-01T10:00:00Z', canEdit: false }]
        window.fetch = async (u) => {
          const s = String(u)
          if (s.includes('/.auth/me')) return json({ clientPrincipal: { userId: 'u1', userRoles: ['anonymous','authenticated','user','moderator','admin'], identityProvider: 'aad', userDetails: 'test@example.com' } })
          if (s.includes('/api/account/me')) return json(me)
          if (s.includes('/api/conversations/unread-count')) return json({ total: 2 })
          if (/\/api\/conversations\/[^/]+\/messages/.test(s)) return json(msgs)
          if (/\/api\/conversations\/[^/]+\/read/.test(s)) return json({ marked: 2 })
          if (s.includes('/api/conversations')) return json(convos)
          if (s.includes('/api/goods')) return json(goods)
          if (s.includes('/api/services')) return json(services)
          if (s.includes('/api/events')) return json(events)
          return json([])
        }
      })()
    </script>
    <script>
      ;(function () {
        const x = new XMLHttpRequest()
        x.open('GET', '/index.html', false)
        x.send()
        const js = x.responseText.match(/src="([^"]+\.js)"/)[1]
        const css = x.responseText.match(/href="([^"]+\.css)"/)[1]
        document.write('<link rel="stylesheet" href="' + css + '">')
        document.write('<script type="module" src="' + js + '"><\/script>')
      })()
    </script>
  </head>
  <body><div id="root"></div></body>
</html>
